name: build_and_publish
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  id-token: write
  contents: write

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    env:
      OUT_DIR: "/GoCardless/bin/Release"
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore
    - name: Build with dotnet
      run: dotnet build --configuration Release
    - name: Run Tests
      run: dotnet test
    - uses: actions/upload-artifact@v4
      with:
        path: "GoCardless/bin/Release/*.nupkg"

  all-tests-passed:
    name: all-tests-passed
    runs-on: ubuntu-latest
    needs: [build_and_test]
    if: always()
    steps:
    - name: Check build_and_test job status
      run: |
        if [ "${{ needs.build_and_test.result }}" != "success" ]; then
          echo "build_and_test job did not succeed"
          exit 1
        fi

  check_version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check if version tag exists
      id: check
      run: |
        VERSION=$(grep -oP '(?<=<PackageVersion>)[^<]+' GoCardless/GoCardless.csproj)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
          echo "Tag v${VERSION} already exists, skipping publish"
          echo "should_publish=false" >> $GITHUB_OUTPUT
        else
          echo "Tag v${VERSION} does not exist, will publish"
          echo "should_publish=true" >> $GITHUB_OUTPUT
        fi

    - name: Extract changelog notes for this version
      id: notes
      if: steps.check.outputs.should_publish == 'true'
      run: |
        VERSION="${{ steps.check.outputs.version }}"
        NOTES=""
        if [ -f CHANGELOG.md ]; then
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## " ver {p=1; next}
            p && /^## / {exit}
            p {print}
          ' CHANGELOG.md)
        fi
        {
          echo "notes<<EOF"
          echo "$NOTES"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

  publish:
    if: github.ref == 'refs/heads/master' && needs.check_version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    needs:
    - build_and_test
    - check_version
    env:
      OUT_DIR: "artifact"
    steps:
    - uses: actions/download-artifact@v4
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Publish the library
      run: dotnet nuget push artifact/*.nupkg -s https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} -n --skip-duplicate

  create_release:
    if: github.ref == 'refs/heads/master' && needs.check_version.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    needs:
    - publish
    - check_version
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Create tag and release
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        TAG="v${{ needs.check_version.outputs.version }}"
        git tag "$TAG"
        git push origin "$TAG"
        NOTES="${{ needs.check_version.outputs.notes }}"
        if [ -n "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
          gh release create "$TAG" --title "$TAG" --notes "$NOTES"
        else
          gh release create "$TAG" --title "$TAG" --generate-notes
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
